# Semiconductor technology catalog for T/R module trades.
#
# Every number carries a citation that was fetched and read when the row was
# written (accessed dates below). Values are survey/review RANGES or single
# published data points, not device commitments: use them to compare
# technologies, then replace with datasheet values for a real design.
# Numeric fields are provenance mappings {value | [lo, hi], units, source,
# url, accessed, kind, confidence, quote}; structural fields are scalars.
# The provenance table in docs/technology-catalog.md is generated from this
# file. Midpoints of [lo, hi] ranges are what `technology_defaults` returns.

